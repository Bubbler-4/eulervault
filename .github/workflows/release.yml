name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset_suffix: linux-x86_64
            binary_name: eulervault
          - target: x86_64-pc-windows-gnu
            asset_suffix: windows-x86_64-gnu
            binary_name: eulervault.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install MinGW cross-compiler
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary asset
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/eulervault-${{ matrix.asset_suffix }}${{ matrix.target == 'x86_64-pc-windows-gnu' && '.exe' || '' }}

      - name: Upload binary to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
