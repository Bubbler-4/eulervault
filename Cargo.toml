[package]
name = "eulervault"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.12"
directories = "6.0"
# Using Rust crypto backend for maximum portability; both "allow"-features are needed
sequoia-openpgp = { version = "2.3", default-features = false, features = ["crypto-rust", "allow-experimental-crypto", "allow-variable-time-crypto"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1.2"
