[package]
name = "eulervault"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.11"
directories = "5.0"
sequoia-openpgp = { version = "1.22", default-features = false, features = ["crypto-rust"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
